# Describes this module to Backstage (https://backstage.altissimo.io), which
# discovers it hourly. Same shape as altissimo-hq/backstage's catalog-info.yaml.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: terraform-google-developer-connect
  namespace: altissimo
  description: Creates Google Cloud Developer Connect Connections and Repositories
  annotations:
    github.com/project-slug: altissimo-hq/terraform-google-developer-connect
    altissimo.io/terraform-registry: altissimo-hq/developer-connect/google
  tags:
    - developer-connect
    - google
    - terraform
    - terraform-modules
  links:
    - url: https://registry.terraform.io/modules/altissimo-hq/developer-connect/google/latest
      title: Terraform Registry
      icon: web
spec:
  type: terraform-module
  lifecycle: production
  owner: group:default/altissimo-agent
  system: altissimo/terraform-modules
